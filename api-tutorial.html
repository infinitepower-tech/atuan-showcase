<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工作平台 API 配置交互教程</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0C11'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23EBB43B' stroke-width='2'/%3E%3Cpath d='M17.5 9 11 17h4.5L14 23l6.5-8.5H16z' fill='%234DE0F2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B0C11; --card:#16181F; --card2:#1D2029; --ink:#F1F3F8; --sub:#A9B0C2; --faint:#6E7688;
  --line:#2A2E3A;
  --gold:#EBB43B; --gold-l:#F0DD95; --gold-d:#C08A1E;
  --cyan:#4DE0F2; --cyan-l:#9CFBFB; --cyan-d:#1FAFC4;
  --steel:#93A4C2; --steel-d:#5B6B86;
  --green:#4ADE80; --green-bg:#0F2418; --green-line:#1F5C38;
  --red:#F87171; --red-bg:#2A1416; --red-line:#7F2D33;
  --radius:16px; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ===== 顶栏 ===== */
.topbar{background:linear-gradient(120deg,#111319,#1A1C25);color:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--gold-d);box-shadow:0 2px 14px rgba(0,0,0,.5)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;cursor:pointer;color:var(--gold-l)}
.brand svg{width:24px;height:24px}
.topnav{display:flex;gap:18px;font-size:13px;color:rgba(241,243,248,.78)}
.topnav button{color:rgba(241,243,248,.78);font-size:13px;padding:6px 10px;border-radius:8px}
.topnav button:hover{background:rgba(235,180,59,.14);color:var(--gold-l)}

/* ===== 首页 hero ===== */
.hero{padding:44px 0 18px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:.5px;color:var(--ink)}
.hero p{margin-top:10px;color:var(--sub);font-size:14px}
.hero .crumb{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--gold-l);background:rgba(235,180,59,.13);border:1px solid rgba(235,180,59,.35);padding:5px 14px;border-radius:999px;margin-bottom:16px}

/* ===== 平台卡片 ===== */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:18px 0 8px}
.p-card{position:relative;border-radius:var(--radius);padding:26px 24px 22px;color:var(--ink);min-height:330px;display:flex;flex-direction:column;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.p-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),transparent 85%)}
.p-card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 14px 32px rgba(0,0,0,.5)}
.p-card.c-cyan{--accent:var(--cyan)}
.p-card.c-gold{--accent:var(--gold)}
.p-card.c-steel{--accent:var(--steel)}
.p-card .c-head{display:flex;justify-content:space-between;align-items:flex-start}
.p-card .c-name{font-size:21px;font-weight:800;color:#fff}
.p-card .c-icon{width:46px;height:46px;color:var(--accent)}
.badge{display:inline-block;margin-top:12px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-size:12px;font-weight:700;padding:4px 14px;border-radius:999px;width:max-content;border:1px solid color-mix(in srgb,var(--accent) 38%,transparent)}
.c-needs{margin-top:18px;font-size:13px}
.c-needs .need-title{font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--sub)}
.c-needs ul{list-style:none}
.c-needs li{padding:3px 0 3px 16px;position:relative;color:#D6DBE8}
.c-needs li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.c-feature{margin-top:auto;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.55;color:#C2C9D8}
.c-feature b{display:block;font-size:12px;margin-bottom:3px;color:var(--accent)}
.c-cta{margin-top:12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--accent)}

/* ===== 通用小节 ===== */
.section{padding:22px 0}
.section h2{font-size:19px;font-weight:800;margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}

/* 速查表 */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{background:#111319;color:var(--gold-l);font-weight:700;font-size:12.5px;text-align:center;border-bottom:1px solid var(--gold-d)}
tbody td{color:#C2C9D8}
tbody tr:hover td{background:rgba(235,180,59,.05)}
tbody td.c-center{text-align:center}
.tag-easy{color:var(--green);font-weight:700}
.tag-mid{color:var(--gold);font-weight:700}
.tag-hot{color:var(--red);font-weight:700}

/* 避坑 */
.pit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pit{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px}
.pit .num{flex:0 0 30px;height:30px;border-radius:50%;color:#0B0C11;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.pit.p1 .num{background:var(--red)}.pit.p2 .num{background:var(--gold)}
.pit.p3 .num{background:var(--cyan)}.pit.p4 .num{background:var(--steel)}
.pit p{font-size:13px;color:#C2C9D8}
.pit b{color:var(--ink)}
.tipbar{margin-top:16px;background:rgba(235,180,59,.12);border:1px solid rgba(235,180,59,.35);border-radius:12px;padding:14px 18px;font-size:13px;font-weight:700;color:var(--gold-l);display:flex;gap:10px;align-items:center}
.tipbar svg{width:20px;height:20px;flex:0 0 20px}

/* ===== 平台教程视图 ===== */
.p-hero{padding:26px 0 14px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--gold-l);background:rgba(235,180,59,.12);border:1px solid rgba(235,180,59,.35);padding:8px 16px;border-radius:999px;margin-bottom:18px}
.back-btn:hover{background:rgba(235,180,59,.24)}
.p-hero .crumb-line{font-size:12px;color:rgba(255,255,255,.82);margin-bottom:10px}
.p-hero h1{color:#fff;font-size:26px;font-weight:800}
.p-hero .sub{color:rgba(255,255,255,.9);font-size:14px;margin-top:8px}
.p-band{color:#fff;background:#14161D;border-bottom:1px solid var(--line);position:relative}
.p-band::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--band-accent),transparent 70%)}
.p-band.b-cyan{--band-accent:var(--cyan)}
.p-band.b-gold{--band-accent:var(--gold)}
.p-band.b-steel{--band-accent:var(--steel)}

.layout{display:grid;grid-template-columns:280px 1fr;gap:24px;padding:22px 0 40px;align-items:start}
.stepnav{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:sticky;top:74px}
.stepnav h3{font-size:13px;font-weight:800;padding:4px 8px 10px;color:var(--sub)}
.step-item{width:100%;text-align:left;border-radius:12px;padding:11px 12px;margin-bottom:4px;display:flex;gap:12px;align-items:flex-start}
.step-item .s-no{flex:0 0 24px;height:24px;border-radius:50%;background:#262A36;color:var(--sub);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step-item .s-body{min-width:0}
.step-item .s-t{font-size:13.5px;font-weight:700;color:var(--ink)}
.step-item .s-d{font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.45}
.step-item.active{background:var(--nav-tint,#102A33)}
.step-item.active .s-no{background:var(--nav-color,var(--cyan));color:#0B0C11}
.step-item.active .s-t{color:var(--nav-color,var(--cyan))}

.panel-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-height:380px}
.step-head{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.step-head .big-no{font-size:15px;font-weight:800;color:var(--nav-color,var(--cyan))}
.step-head h2{font-size:20px;font-weight:800;color:var(--ink)}
.step-desc{color:var(--sub);font-size:14px;margin-bottom:16px}
.step-path{background:#111319;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#C2C9D8;margin-bottom:14px}

/* 截图实例 */
.shot-label{font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 8px}
.shot-frame{background:#101218;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center}
.shot-frame img{max-width:100%;height:auto;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.55)}
.shot-cap{margin-top:10px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.5}

/* 红绿对比 */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.cmp{border-radius:14px;padding:16px 18px}
.cmp.bad{background:var(--red-bg);border:1px solid var(--red-line)}
.cmp.good{background:var(--green-bg);border:1px solid var(--green-line)}
.cmp h4{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.cmp.bad h4{color:var(--red)}.cmp.good h4{color:var(--green)}
.cmp .code{margin:12px 0;background:#0B0C11;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px;word-break:break-all}
.cmp.bad .code{color:#FCA5A5}.cmp.good .code{color:#86EFAC}
.cmp p{font-size:12px;color:var(--sub)}
.why{margin-top:16px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.why h4{font-size:14px;font-weight:800;margin-bottom:8px;color:var(--ink)}
.why p{font-size:13px;color:var(--sub);margin-bottom:4px}

/* 字段卡 */
.field-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:8px}
.field{background:var(--field-tint,#1B2230);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.field .f-t{font-size:13.5px;font-weight:800;color:var(--nav-color,var(--cyan));margin-bottom:5px}
.field .f-d{font-size:12.5px;color:#C2C9D8;line-height:1.55}
.nav-tip{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:12.5px;font-weight:700;line-height:1.5;border:1px solid var(--line)}

footer{padding:26px 0 40px;color:var(--faint);font-size:12px;text-align:center}
.pt-list{margin:6px 0 4px;padding-left:20px;font-size:13.5px;color:#C2C9D8}
.pt-list li{margin:5px 0}
.pt-list code{background:#111319;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12px;color:var(--cyan-l)}

/* ===== 小白概念图解 ===== */
.concept{margin:14px 0;background:#111319;border:1px dashed #394050;border-radius:14px;padding:16px 18px}
.concept .c-label{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--nav-color,var(--cyan));background:color-mix(in srgb,var(--nav-color,var(--cyan)) 12%,transparent);padding:3px 10px;border-radius:999px}
.concept .c-title{font-size:14.5px;font-weight:800;color:var(--ink);margin:10px 0 5px}
.concept .c-plain{font-size:12.5px;color:var(--sub);margin-bottom:12px;line-height:1.6}
.concept .c-svg-wrap{background:#0B0C11;border:1px solid var(--line);border-radius:12px;padding:12px}
.concept svg{width:100%;height:auto;display:block}
.concept .c-svg-wrap text{font-family:inherit}
/* 首页三名词卡 */
.gloss{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
.gloss .g-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.gloss .g-card h4{font-size:13.5px;font-weight:800;margin:8px 0 6px;color:var(--gold-l)}
.gloss .g-card p{font-size:12.5px;color:var(--sub);line-height:1.6}
.gloss .g-card svg{width:40px;height:40px}
@media (max-width:640px){.gloss{grid-template-columns:1fr}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.p-bottom{margin-top:22px;text-align:center}
.p-bottom button{background:var(--nav-color,var(--cyan));color:#0B0C11;font-size:13.5px;font-weight:700;padding:11px 26px;border-radius:999px}
.p-bottom button:hover{filter:brightness(1.08)}

/* ===== 自动演示模式 ===== */
.demo-switch-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:14px}
.ds-label{font-size:13.5px;font-weight:800;color:var(--gold-l)}
.ds-hint{font-size:12px;color:var(--sub);flex:1;min-width:200px;line-height:1.5}
.ds-toggle{width:52px;height:28px;border-radius:999px;background:#2A2E3A;position:relative;transition:background .2s;border:1px solid var(--line);flex:0 0 auto}
.ds-toggle .ds-dot{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#93A4C2;transition:left .2s,background .2s}
.ds-toggle.on{background:rgba(235,180,59,.25);border-color:var(--gold)}
.ds-toggle.on .ds-dot{left:26px;background:var(--gold)}
.demo-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#111319;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.db-btn{font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:999px;background:var(--gold);color:#1A1405}
.db-btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
.db-btn:hover{filter:brightness(1.06)}
.demo-track{flex:1;min-width:120px;height:6px;background:#262A36;border-radius:999px;overflow:hidden}
.demo-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:999px;transition:width .4s ease}
.demo-status{font-size:12px;color:var(--sub);white-space:nowrap}
.narrate{display:flex;gap:12px;align-items:flex-start;background:var(--field-tint,#102A33);border-left:3px solid var(--nav-color,var(--cyan));border-radius:10px;padding:12px 16px;margin-bottom:16px}
.n-ico{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--nav-color,var(--cyan));background:color-mix(in srgb,var(--nav-color,var(--cyan)) 14%,transparent);padding:3px 10px;border-radius:999px;margin-top:1px}
.narrate p{font-size:13.5px;color:#E2E7F0;line-height:1.6}
@media (prefers-reduced-motion:reduce){.demo-fill{transition:none}.ds-toggle,.ds-dot{transition:none}}

/* ===== 响应式 ===== */
@media (max-width:1024px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .layout{grid-template-columns:1fr}
  .stepnav{position:static;display:flex;flex-wrap:wrap;gap:6px}
  .stepnav h3{width:100%}
  .step-item{flex:1 1 46%;margin-bottom:6px}
}
@media (max-width:640px){
  .hero h1{font-size:23px}
  .cards{grid-template-columns:1fr}
  .pit-grid{grid-template-columns:1fr}
  .compare{grid-template-columns:1fr}
  .step-item{flex:1 1 100%}
  .topnav{display:none}
  .p-hero h1{font-size:21px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand" id="brandHome">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11.5" fill="none" stroke="#EBB43B" stroke-width="2.2"/><path d="M17.6 9.5 11.5 17h4.3L14.2 22.5l6.3-8.2H16.2z" fill="#4DE0F2"/></svg>
      AI 工作平台 API 配置教程
    </div>
    <nav class="topnav">
      <button id="navHome">选择平台</button>
      <button id="navTable">速查表</button>
    </nav>
  </div>
</header>
<div id="app"></div>
<footer>照着做就能跑通 · 重点坑点已标出 · 界面截图来自对应工具官方资料与实操界面</footer>
<div class="sr-only" aria-hidden="true">
  <img src="images/cherry-setup.jpg" alt="cherry setup">
  <img src="images/cherry-interface.jpg" alt="cherry interface">
  <img src="images/wb-add-model.jpg" alt="wb add model">
  <img src="images/wb-fields.jpg" alt="wb fields">
  <img src="images/cc-providers.jpg" alt="cc providers">
  <img src="images/cc-edit.jpg" alt="cc edit">
</div>

<script>
/* ===== 平台概要（首页卡片用） ===== */
const OVERVIEW = [
  {key:"cherry", cls:"c-cyan", color:"#4DE0F2", name:"Cherry Studio", badge:"难度：简单",
   needs:["API 密钥（sk-xxx）","API 地址","点“检查”连通"],
   feature:{title:"特点", text:"内置几十家服务商预设，选对应服务商即可，配完点检查连通。"}},
  {key:"workbuddy", cls:"c-gold", color:"#EBB43B", name:"WorkBuddy", badge:"难度：中等（有坑）",
   needs:["接口地址（注意后缀！）","API Key","模型名称"],
   feature:{title:"重点避坑", text:"地址必须带 /v1 后缀，很多人在这里配错，后页有专门警告。"}},
  {key:"ccswitch", cls:"c-steel", color:"#93A4C2", name:"CC Switch", badge:"难度：稍复杂（多供应商）",
   needs:["选工具分组","预设 / 自定义供应商","填地址 + API Key"],
   feature:{title:"特点", text:"一键切换多渠道，多账号用户配好后随点随切，不用改配置文件。"}}
];

/* ===== 首页速查表数据 ===== */
const TABLE_ROWS = [
  {p:"Cherry Studio", pcolor:"#4DE0F2", what:"Key + 地址", suffix:"根地址即可，自动补全", diff:"简单", diffCls:"tag-easy", feat:"内置几十家预设，选了就用"},
  {p:"WorkBuddy", pcolor:"#EBB43B", what:"地址 + Key + 模型名", suffix:"必须带 /v1 后缀！", diff:"中等", diffCls:"tag-mid", feat:"自定义模型接入，支持办公场景"},
  {p:"CC Switch", pcolor:"#93A4C2", what:"选预设 + 填 Key", suffix:"预设自动填，不用管", diff:"稍复杂", diffCls:"tag-mid", feat:"多供应商一键切换，适合多账号"}
];
const PITS = [
  {c:"p1", n:"1", html:"<b>地址少了 /v1</b> —— WorkBuddy 最多人犯的错"},
  {c:"p2", n:"2", html:"<b>Key 复制多了空格</b> —— 粘贴时前后带空格就连不上"},
  {c:"p3", n:"3", html:"<b>模型名填错</b> —— 必须和平台上的 ID 一字不差"},
  {c:"p4", n:"4", html:"<b>配完没开开关</b> —— Cherry 右上角开关一定要打开"}
];

const GLOSS = [
  {icon:`<svg viewBox="0 0 24 24" fill="none" stroke="#EBB43B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><path d="M11 11l9 9M17 17l3-3M15 19l2-2"/></svg>`,

function cancelDemoTimer(){ if(demo.timer){clearTimeout(demo.timer);demo.timer=null;} }
function sayLine(key,step){ const a=NARRATE[key]; return (a&&a[step])||''; }
function demoSchedule(key,step){
  cancelDemoTimer();
  demo.playing=true;
  const total=P[key].steps.length;
  const cur=P[key].steps[step];
  const delay=(cur.img||cur.concept)?4400:2800;
  demo.timer=setTimeout(()=>{
    if(step+1<total){ location.hash=`#/${key}/${step+1}`; }
    else { demo.playing=false; refreshDemoBar(); }
  },delay);
  refreshDemoBar();
}
function refreshDemoBar(){
  const play=document.getElementById('dPlay');
  if(!play) return;
  play.textContent=demo.playing?'暂停讲解':'播放讲解';
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderCompare(b){
  return `
  <div class="compare">
    <div class="cmp bad">
      <h4><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>错误写法</h4>
      <div class="code mono">${esc(b.bad.code)}</div>
      <p>${b.bad.p}</p>
    </div>
    <div class="cmp good">
      <h4><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>正确写法</h4>
      <div class="code mono">${esc(b.good.code)}</div>
      <p>${b.good.p}</p>
    </div>
  </div>
  <div class="why">
    <h4>为什么会失败</h4>
    ${b.why.map(x=>`<p>· ${x}</p>`).join('')}
    <div class="tipbar" style="margin-top:10px"><span>${b.mantra}</span></div>
  </div>`;
}
function renderFields(list,tip){
  return `<div class="field-grid">${list.map(f=>`
    <div class="field"><div class="f-t">${f.t}</div><div class="f-d">${f.d}</div></div>`).join('')}</div>
    <div class="nav-tip" style="background:var(--field-tint,#102A33);color:var(--nav-color,#4DE0F2)">${tip}</div>`;
}
function renderConcept(c){
  return `<div class="concept">
    <span class="c-label">小白图解 · ${c.tag||'名词解释'}</span>
    <div class="c-title">${c.title}</div>
    <div class="c-plain">${c.plain}</div>
    <div class="c-svg-wrap">${c.svg}</div>
  </div>`;
}

function renderPlatform(key,step){
  const d=P[key]; if(!d){renderHome();return;}
  step=Math.max(0,Math.min(step,d.steps.length-1));
  const firstEnter=demo.key!==key;
  cancelDemoTimer();
  demo.key=key; demo.step=step;
  const cur=d.steps[step];
  const total=d.steps.length;
  const navItems=d.steps.map((s,i)=>`
    <button class="step-item ${i===step?'active':''}" data-step="${i}">
      <span class="s-no">${i+1}</span>
      <span class="s-body"><span class="s-t">${s.title}</span><span class="s-d">${s.desc||''}</span></span>
    </button>`).join('');

  const say=sayLine(key,step);
  const demoBar=`
  <div class="demo-bar">
    <button class="db-btn" id="dPlay">播放讲解</button>
    <button class="db-btn ghost" id="dRestart">从头播放</button>
    <div class="demo-track"><div class="demo-fill" id="dFill" style="width:${((step+1)/total*100).toFixed(1)}%"></div></div>
    <span class="demo-status" id="dStatus">第 ${step+1} / ${total} 步</span>
  </div>`;
  const narrate=say?`<div class="narrate"><span class="n-ico">讲解员</span><p>${say}</p></div>`:'';

  let body=demoBar+narrate;
  body+=`<div class="step-head"><span class="big-no">步骤 ${step+1} / ${d.steps.length}</span><h2>${cur.title}</h2></div>`;
  if(cur.desc) body+=`<p class="step-desc">${cur.desc}</p>`;
  if(cur.path) body+=`<div class="step-path mono">${cur.path}</div>`;
  if(cur.points) body+=`<ul class="pt-list">${cur.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  if(cur.concept) body+=renderConcept(cur.concept);
  if(cur.block==='compare') body+=renderCompare(d.compare);
  if(cur.block==='fields') body+=renderFields(d.fields,d.fieldsTip);
  if(cur.img) body+=`<div class="shot-label">界面实例</div>
    <div class="shot-frame"><img src="${cur.img}" alt="${esc(cur.caption||'界面截图')}"><div class="shot-cap">${cur.caption||''}</div></div>`;
  if(cur.tip) body+=`<div class="nav-tip" style="background:var(--field-tint,#102A33);color:var(--nav-color,#4DE0F2);margin-top:14px">${cur.tip}</div>`;

  app.innerHTML=`
  <section class="p-band ${d.bandCls}">
    <div class="wrap p-hero">
      <button class="back-btn" id="backHome">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        返回选择平台
      </button>
      <div class="crumb-line">首页 / ${d.title.split("：")[0]}</div>
      <h1>${d.title}</h1>
      <div class="sub">${d.sub}</div>
    </div>
  </section>
  <section class="wrap">
    <div class="layout" style="--nav-color:${d.color};--nav-tint:${d.tint};--field-tint:${d.tint}">
      <aside class="stepnav">
        <h3>操作步骤（共 ${d.steps.length} 步）</h3>
        ${navItems}
      </aside>
      <div class="panel-box">${body}
        <div class="p-bottom">
          <button id="backHome2">← 返回选择平台</button>
        </div>
      </div>
    </div>
  </section>`;

  const stopAll=()=>{ cancelDemoTimer(); demo.playing=false; demo.key=null; };
  document.getElementById('backHome').onclick=()=>{stopAll();location.hash='#/';};
  document.getElementById('backHome2').onclick=()=>{stopAll();location.hash='#/';};
  app.querySelectorAll('.step-item').forEach(it=>{
    it.addEventListener('click',()=>{ cancelDemoTimer(); demo.playing=false; location.hash=`#/${key}/${it.dataset.step}`; });
  });
  const play=document.getElementById('dPlay');
  const restart=document.getElementById('dRestart');
  play.onclick=()=>{ if(demo.playing){cancelDemoTimer();demo.playing=false;} else {demoSchedule(key,step);} refreshDemoBar(); };
  restart.onclick=()=>{ demo.playing=true; renderPlatform(key,0); };
  if(demo.on && firstEnter){ demo.playing=true; }
  if(demo.playing){ demoSchedule(key,step); refreshDemoBar(); }
  bindGlobal();
  window.scrollTo(0,0);
}

function bindGlobal(){
  document.getElementById('brandHome').onclick=()=>location.hash='#/';
  document.getElementById('navHome').onclick=()=>location.hash='#/';
  const nt=document.getElementById('navTable');
  if(nt) nt.onclick=()=>{ location.hash='#/'; setTimeout(()=>document.getElementById('tableSec')?.scrollIntoView({behavior:'smooth'}),60); };
}

/* ===== hash 路由 ===== */
function route(){
  const h=location.hash.replace(/^#\//,'') || '';
  const parts=h.split('/');
  if(!parts[0]){ renderHome(); return; }
  if(parts[0]==='table'){ renderHome(); setTimeout(()=>document.getElementById('tableSec')?.scrollIntoView({behavior:'smooth'}),60); return; }
  const plat=parts[0];
  if(OVERVIEW.some(o=>o.key===plat)){
    renderPlatform(plat, parseInt(parts[1]||'0',10)||0);
  } else { renderHome(); }
}
window.addEventListener('hashchange',route);
route();
</script>
